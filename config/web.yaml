  LU0496786657: 6TVM.DE
  LU1681045370: AMEM.DE
  IE00B42NKQ00: QDVF.DE
  IE00BG0J4841: IS4S.DE
  LU2023679090: ELCR.DE
  US88160R1014: TSLA
  US3743964062: GEVO
  US8835561023: TMO
  US62914V1061: NIO
