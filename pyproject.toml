[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-info-app"
version = "0.1.0"
description = "Local-first, risk-aware quantitative investment research"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50,<2",
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "pyarrow>=15,<20",
  "PyYAML>=6,<7",
  "pypdf>=4,<6",
  "requests>=2.31,<3",
  "plotly>=5.20,<7",
  "yfinance>=0.2.65,<2",
  "exchange-calendars>=4.8,<5",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
